name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: esneme-preview-debug-key-v1
      - name: Prepare persistent preview signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "ESNEME_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Test, lint and assemble
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare installable APK
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/esneme-molasi-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs deliverables/esneme-molasi-preview.apk > deliverables/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions deliverables/esneme-molasi-preview.apk > deliverables/permissions.txt
          if rg -q 'android.permission.(INTERNET|CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACTIVITY_RECOGNITION)' deliverables/permissions.txt; then
            echo 'Unexpected sensitive permission in APK'
            exit 1
          fi
          cd deliverables
          sha256sum esneme-molasi-preview.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esneme-molasi-apk
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Download instructions
        run: |
          echo '### APK hazır' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bu çalıştırmanın **Artifacts** bölümünden **esneme-molasi-apk** dosyasını indirip ZIP içindeki APK dosyasını açın.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bu, kurulum için imzalanmış bir önizleme APK dosyasıdır. Play Store üretim sürümü değildir. Sağlık içerikleri uzman incelemesi bekler.' >> "$GITHUB_STEP_SUMMARY"

  device-test:
    name: Android emulator smoke tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI tests in Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash ci/device-tests.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-evidence
          path: |
            emulator-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
